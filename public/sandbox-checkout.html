<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox checkout · AmaniCare</title>
<link rel="stylesheet" href="/styles.css">
<!--sentry-->
<script type="module" src="/sandbox.js"></script>
</head>
<body>
<main>
  <div class="card">
    <span class="sandbox-flag">SANDBOX · NO REAL MONEY</span>
    <h1>Partner checkout</h1>
    <p class="muted">In production, the licensed partner (for example Equity BCDC) shows its own secure card or bank payment page here. AmaniCare never sees card details.</p>
    <div id="info"><span class="spinner"></span></div>
    <label for="card">Card number (any value)</label>
    <input id="card" value="4242 4242 4242 4242" inputmode="numeric">
    <div class="row">
      <button class="grow" id="pay">Pay</button>
      <button class="grow danger" id="fail">Simulate a declined card</button>
    </div>
  </div>
</main>
<div id="toast" class="toast"></div>
</body>
</html>
