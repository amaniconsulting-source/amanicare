<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<title>AmaniCare</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<!--sentry-->
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="bar">
  <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>AmaniCare</span></div>
  <div class="bar-actions">
    <select id="langSel" aria-label="Language">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="ln">Lingála</option>
      <option value="sw">Kiswahili</option>
    </select>
    <button id="logoutBtn" class="link hidden" type="button"></button>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" role="status"></div>
</body>
</html>
